name: Automated Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hepatox_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-flask pytest-mock
    
    - name: Create test database
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hepatox_test
      run: |
        pip install psycopg2-binary
        python -c "import psycopg2; conn = psycopg2.connect('dbname=hepatox_test user=postgres password=postgres host=localhost'); conn.close(); print('Database connection successful')"
    
    - name: Run API tests
      run: |
        pytest tests/test_api.py -v --cov=routes --cov-report=xml
      continue-on-error: true
    
    - name: Run ML model tests
      run: |
        pytest tests/test_models.py -v --cov=utils --cov-report=xml
      continue-on-error: true
    
    - name: Run database tests
      run: |
        pytest tests/test_database.py -v --cov=database --cov-report=xml
      continue-on-error: true
    
    - name: Run deep learning tests
      run: |
        pytest tests/test_deep_learning.py -v --cov=utils.deep_learning_utils --cov-report=xml
      continue-on-error: true

  integration-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-flask pytest-mock requests
    
    - name: Run integration tests
      run: |
        pytest tests/test_integration.py -v
      continue-on-error: true
    
    - name: Run end-to-end tests
      run: |
        pytest tests/test_e2e.py -v
      continue-on-error: true

  performance-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-benchmark memory-profiler
    
    - name: Run performance tests
      run: |
        pytest tests/test_performance.py -v --benchmark-only
      continue-on-error: true
