{% extends "base.html" %}

{% block title %}Page Not Found - HepatoX{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-6">
            <div class="mb-4">
                <h1 class="display-1 fw-bold text-danger">404</h1>
                <h2 class="mb-3">Page Not Found</h2>
                <p class="lead text-muted mb-4">
                    The page you're looking for doesn't exist or has been moved.
                </p>
            </div>
            
            <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg me-2">
                <i class="fas fa-home"></i> Go to Home
            </a>
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary btn-lg">
                <i class="fas fa-chart-line"></i> Go to Dashboard
            </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
