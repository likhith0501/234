{% extends "base.html" %}

{% block title %}Login - HepatoX{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-5">
                        <h2 class="card-title fw-bold">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </h2>
                        <p class="text-muted">Access your HepatoX account</p>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                <i class="fas fa-user"></i> Username
                            </label>
                            <input type="text" class="form-control form-control-lg" id="username" name="username" required autofocus>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock"></i> Password
                            </label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" required>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me">
                            <label class="form-check-label" for="remember_me">
                                Remember me
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <p class="mb-2">
                            Don't have an account?
                            <a href="{{ url_for('register') }}">Register here</a>
                        </p>
                        <p>
                            <a href="{{ url_for('forgot_password') }}" class="text-decoration-none">Forgot password?</a>
                        </p>
                    </div>

                    <!-- Demo Credentials -->
                    <div class="alert alert-info mt-4" role="alert">
                        <i class="fas fa-info-circle"></i> <strong>Demo Account:</strong>
                        <br>Username: <code>admin</code>
                        <br>Password: <code>Admin@123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
