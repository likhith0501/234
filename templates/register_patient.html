{% extends "base.html" %}

{% block title %}Register Patient - HepatoX{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-5">
                        <h2 class="card-title fw-bold">
                            <i class="fas fa-stethoscope"></i> Register New Patient
                        </h2>
                        <p class="text-muted">Enter patient medical information</p>
                    </div>

                    <form method="POST">
                        <!-- Personal Information -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2">
                                <i class="fas fa-user"></i> Personal Information
                            </h5>
                            
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name *</label>
                                <input type="text" class="form-control form-control-lg" id="name" name="name" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="age" class="form-label">Age (years) *</label>
                                    <input type="number" class="form-control form-control-lg" id="age" name="age" min="18" max="120" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="gender" class="form-label">Gender *</label>
                                    <select class="form-select form-select-lg" id="gender" name="gender" required>
                                        <option value="">Select Gender</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Health Metrics -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2">
                                <i class="fas fa-heartbeat"></i> Health Metrics
                            </h5>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="bmi" class="form-label">BMI (Body Mass Index) *</label>
                                    <input type="number" class="form-control form-control-lg" id="bmi" name="bmi" step="0.1" min="10" max="60" required>
                                    <small class="text-muted">Example: 25.5</small>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="liver_function_test" class="form-label">Liver Function Test (LFT) *</label>
                                    <input type="number" class="form-control form-control-lg" id="liver_function_test" name="liver_function_test" step="0.1" min="0" required>
                                    <small class="text-muted">Value (U/L)</small>
                                </div>
                            </div>
                        </div>

                        <!-- Lifestyle Factors -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2">
                                <i class="fas fa-running"></i> Lifestyle Factors
                            </h5>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="alcohol_consumption" class="form-label">Alcohol Consumption *</label>
                                    <select class="form-select form-select-lg" id="alcohol_consumption" name="alcohol_consumption" required>
                                        <option value="">Select...</option>
                                        <option value="0">No / Rarely</option>
                                        <option value="1">Yes / Regularly</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="smoking" class="form-label">Smoking *</label>
                                    <select class="form-select form-select-lg" id="smoking" name="smoking" required>
                                        <option value="">Select...</option>
                                        <option value="0">Non-Smoker</option>
                                        <option value="1">Smoker</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="physical_activity" class="form-label">Physical Activity *</label>
                                    <select class="form-select form-select-lg" id="physical_activity" name="physical_activity" required>
                                        <option value="">Select Level</option>
                                        <option value="0">Low</option>
                                        <option value="1">Moderate</option>
                                        <option value="2">High</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="genetic_risk" class="form-label">Genetic Risk *</label>
                                    <select class="form-select form-select-lg" id="genetic_risk" name="genetic_risk" required>
                                        <option value="">Select...</option>
                                        <option value="0">No Family History</option>
                                        <option value="1">Family History Present</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Medical Conditions -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2">
                                <i class="fas fa-prescription-bottle-alt"></i> Medical Conditions
                            </h5>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="diabetes" class="form-label">Diabetes *</label>
                                    <select class="form-select form-select-lg" id="diabetes" name="diabetes" required>
                                        <option value="">Select...</option>
                                        <option value="0">No</option>
                                        <option value="1">Yes</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="hypertension" class="form-label">Hypertension *</label>
                                    <select class="form-select form-select-lg" id="hypertension" name="hypertension" required>
                                        <option value="">Select...</option>
                                        <option value="0">No</option>
                                        <option value="1">Yes</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Submit Buttons -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('patients') }}" class="btn btn-secondary btn-lg">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save"></i> Register Patient
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
